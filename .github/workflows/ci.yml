name: CI

on:
  push:
    branches: [main, "update/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (macOS)
    runs-on: macos-14
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Deliberately NOT pinned to a specific Xcode_<version>.app. GitHub
      # rotates what is installed on the runner images, and a hard pin turns
      # a routine image update into a red build on a step unrelated to our
      # code. The runner's default Xcode tracks a supported release; the
      # version is printed below so a toolchain-caused failure is still
      # obvious in the log.
      - name: Show toolchain versions
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      # .xcodeproj is gitignored — project.yml is the source of truth, so the
      # project has to be generated before anything can build.
      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project CyphrWhispr.xcodeproj \
            -scheme CyphrWhispr

      # No `| xcpretty || true`. That combination made this step incapable of
      # failing, which defeated the point of building at all — a compile error
      # still reported green. Raw xcodebuild with -quiet keeps the log readable
      # while letting a non-zero exit fail the job.
      #
      # Signing is disabled: the local build uses a self-signed "CyphrWhispr Dev"
      # cert that exists only in the developer's Keychain, so CI verifies that
      # the code COMPILES, not that it ships signed.
      - name: Build
        run: |
          xcodebuild build \
            -project CyphrWhispr.xcodeproj \
            -scheme CyphrWhispr \
            -configuration Debug \
            -destination 'platform=macOS' \
            -quiet \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: |
          xcodebuild test \
            -project CyphrWhispr.xcodeproj \
            -scheme CyphrWhispr \
            -destination 'platform=macOS' \
            -enableCodeCoverage YES \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

  lint:
    name: Lint (SwiftFormat + SwiftLint)
    runs-on: macos-14
    timeout-minutes: 10
    # Advisory until the repo carries lint configuration. There is no
    # .swiftlint.yml or .swiftformat in-tree, so both tools would run their
    # stock rule sets against ~70 files that have never been linted —
    # producing a red badge for style while saying nothing about correctness.
    # Non-blocking keeps the signal visible without gating merges on it.
    # Remove this once configs land and the existing violations are cleared.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          brew install swiftformat swiftlint

      - name: SwiftFormat (lint mode)
        run: swiftformat --lint .

      - name: SwiftLint
        run: swiftlint
